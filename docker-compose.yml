version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: monday-clone-db
    environment:
      POSTGRES_USER: monday_user
      POSTGRES_PASSWORD: monday_password
      POSTGRES_DB: monday_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monday_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

